services:
  - type: web
    name: aramarket-api
    runtime: python
    rootDir: "backend"
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn araMarket.wsgi:application --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,aramarket.onrender.com,aramarket-api.onrender.com"
      - key: FRONTEND_URL
        value: "https://aramarket.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://aramarket.onrender.com,https://aramarket-api.onrender.com,http://localhost:5173,http://localhost:3000,http://localhost:4173"
      - key: DATABASE_URL
        fromDatabase:
          name: aramarket-db
          property: connectionString
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: SUPABASE_URL
        value: "https://drqzggozpiuzwxiouphh.supabase.co"
      - key: SUPABASE_PUBLISHABLE_KEY
        value: "sb_publishable_f87wyJw9zUeyUqqK_B69cg_dTmAYnJu"
      - key: SUPABASE_SECRET_KEY
        value: "sb_secret_tFCKFyA2hIlOT6f1fMU3sA_ehCMYleA"
      - key: SUPABASE_JWKS_URL
        value: "https://drqzggozpiuzwxiouphh.supabase.co/auth/v1/.well-known/jwks.json"

  - type: web
    name: aramarket
    runtime: static
    rootDir: "frontend"
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://aramarket-api.onrender.com/api"
      - key: VITE_APP_NAME
        value: "AraMarket"
      - key: VITE_ENVIRONMENT
        value: "production"
      - key: VITE_SUPABASE_URL
        value: "https://drqzggozpiuzwxiouphh.supabase.co"
      - key: VITE_SUPABASE_ANON_KEY
        value: "sb_publishable_f87wyJw9zUeyUqqK_B69cg_dTmAYnJu"
        

databases:
  - name: aramarket-db
    databaseName: aramarket
    user: aramarket
    plan: free
